<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogos ao Vivo</title>
<meta name="description" content="Agenda, placar ao vivo, escalações, tabela e onde assistir: Brasileirão, Premier League, Champions, NBA e NFL.">
<meta name="theme-color" content="#0f1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jogos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://dcnbzsnapraixttaygna.supabase.co">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: uma coluna de celular. Cabeçalho escuro fixo no topo, conteúdo da tela no meio, barra de navegação (Jogos, Campeonatos, Buscar) fixa embaixo. */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #0f1520;
  --muted: #5d6676;
  --line: #dbe0e8;
  --bar: #0f1520;
  --bar-ink: #f2f4f8;
  --bar-muted: #8f99ab;
  --live: #d7262e;
  --live-soft: #fde7e8;
  --flash: #fff1b8;
  --win: #178a4c;
  --draw: #8a93a3;
  --loss: #d7262e;
  --yellow: #f2c200;
  --pitch: #2e7d4f;
  --pitch-2: #2a7349;
  --pitch-line: rgba(255, 255, 255, .45);
  --lg-bra1: #138048;
  --lg-epl: #5b2a86;
  --lg-ucl: #1c3a8a;
  --lg-nba: #c9462a;
  --lg-nfl: #0b5aa8;
  --shadow: 0 1px 2px rgba(15, 21, 32, .06), 0 4px 14px rgba(15, 21, 32, .05);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --nav-h: 60px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e15; --surface: #141a24; --surface-2: #1a2130; --ink: #e9edf4; --muted: #8e98aa; --line: #253043;
    --bar: #05080d; --bar-ink: #f2f4f8; --bar-muted: #7d889b;
    --live: #ff4d55; --live-soft: #3a1418; --flash: #4a3f12;
    --win: #3dcc7c; --draw: #7d879a; --loss: #ff5a61; --yellow: #f5cd2a;
    --pitch: #1d5a37; --pitch-2: #1a5232; --pitch-line: rgba(255, 255, 255, .3);
    --lg-bra1: #3dcc7c; --lg-epl: #b98ae6; --lg-ucl: #7f9cf0; --lg-nba: #ff8a66; --lg-nfl: #64a8f0;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e15; --surface: #141a24; --surface-2: #1a2130; --ink: #e9edf4; --muted: #8e98aa; --line: #253043;
  --bar: #05080d; --bar-ink: #f2f4f8; --bar-muted: #7d889b;
  --live: #ff4d55; --live-soft: #3a1418; --flash: #4a3f12;
  --win: #3dcc7c; --draw: #7d879a; --loss: #ff5a61; --yellow: #f5cd2a;
  --pitch: #1d5a37; --pitch-2: #1a5232; --pitch-line: rgba(255, 255, 255, .3);
  --lg-bra1: #3dcc7c; --lg-epl: #b98ae6; --lg-ucl: #7f9cf0; --lg-nba: #ff8a66; --lg-nfl: #64a8f0;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.35; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }

/* ---------- cabeçalho ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink); }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; min-height: 54px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-stretch: 125%; font-weight: 900; font-size: 1.3rem; letter-spacing: -.01em; text-transform: uppercase; line-height: 1; }
.brand h1 span { color: var(--live); }
.sub { display: flex; align-items: center; gap: 6px; padding-block: 8px; min-height: 54px; }
.sub h1 { margin: 0; font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.back { flex: none; width: 40px; height: 40px; margin-left: -8px; border: 0; background: transparent; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--bar-ink); }
.back:hover { background: rgba(255,255,255,.08); }
.livecount { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--bar-ink); background: rgba(255,255,255,.08); border-radius: 999px; padding: 6px 11px; white-space: nowrap; }
.livecount.off { color: var(--bar-muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); flex: none; display: inline-block; }
.livecount.off .dot { background: var(--bar-muted); }
.livecount:not(.off) .dot, .st.live .dot, .hero .live .dot { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

.days { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; scroll-snap-type: x proximity; }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; border: 0; background: transparent; color: var(--bar-muted); border-radius: 10px; padding: 7px 11px 6px; cursor: pointer; text-align: center; scroll-snap-align: center; min-width: 58px; }
.day b { display: block; font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: .95rem; text-transform: uppercase; letter-spacing: .02em; }
.day small { display: block; font-size: .72rem; font-variant-numeric: tabular-nums; margin-top: 1px; }
.day[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); }
.day.has-live b::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--live); margin-left: 5px; vertical-align: middle; }

/* ---------- navegação de baixo ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a[aria-current="page"] svg { color: var(--live); }

/* ---------- comum ---------- */
main { padding-block: 8px calc(var(--nav-h) + 32px); display: flex; flex-direction: column; gap: 18px; }
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 12px 0; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: .88rem; font-weight: 600; cursor: pointer; }
.chip i { width: 9px; height: 9px; border-radius: 3px; background: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.section { display: flex; flex-direction: column; gap: 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-top: 6px; }
.sec-head h2, .sec-title { margin: 0; display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .02em; }
.sec-head h2 i { width: 4px; height: 18px; border-radius: 2px; background: var(--c); }
.sec-head a { display: inline-flex; align-items: center; gap: 4px; }
.sec-head small { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.lg-tv { margin: -2px 0 2px 13px; font-size: .82rem; color: var(--muted); text-wrap: pretty; }
.lg-tv b { color: var(--ink); font-weight: 600; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.pad { padding: 14px; }
.muted { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty strong { color: var(--ink); font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 1.15rem; text-transform: uppercase; }
.skel { height: 64px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sk 1.2s linear infinite; border-top: 1px solid var(--line); }
.skel:first-child { border-top: 0; }
@keyframes sk { to { background-position: -200% 0; } }
.foot { text-align: center; font-size: .76rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.banner { background: var(--live-soft); color: var(--ink); border-radius: 10px; padding: 9px 12px; font-size: .85rem; }
.logo { width: 24px; height: 24px; object-fit: contain; flex: none; }
.ph { display: inline-block; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); flex: none; }
.date-head { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 14px; background: var(--surface-2); border-top: 1px solid var(--line); }
.date-head:first-child { border-top: 0; }

/* ---------- linha de jogo ---------- */
.game { display: grid; grid-template-columns: 66px minmax(0, 1fr) 14px; gap: 0 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); transition: background-color .6s; }
.game:first-child, .date-head + .game { border-top: 0; }
.game:hover { background: var(--surface-2); }
.game.flash { background: var(--flash); transition: none; }
.game .chev { color: var(--muted); opacity: .6; }
.st { display: flex; flex-direction: column; justify-content: center; gap: 3px; font-variant-numeric: tabular-nums; min-width: 0; border-right: 1px solid var(--line); padding-right: 10px; align-self: stretch; }
.st .t { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 1.15rem; line-height: 1; }
.st .s { white-space: nowrap; font-size: .7rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.st.live .t { color: var(--live); font-size: 1rem; }
.st.live .s { color: var(--live); display: inline-flex; align-items: center; gap: 5px; }
.st.live .dot { width: 6px; height: 6px; }
.st.post .t { color: var(--muted); font-size: .95rem; }
.st.off .t { color: var(--muted); font-size: .9rem; text-decoration: line-through; }
.teams { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.row .nm { font-weight: 600; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sc { font-family: var(--f-display); font-stretch: 75%; font-weight: 800; font-size: 1.35rem; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.4ch; text-align: right; }
.row.lose .nm, .row.lose .sc { color: var(--muted); font-weight: 500; }
.row.bump .sc { color: var(--live); }
.tvline { grid-column: 2; margin-top: 7px; font-size: .8rem; color: var(--muted); display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.tvline span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tvbar { display: flex; align-items: baseline; gap: 8px; margin: 0 14px 12px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); font-size: .86rem; }
.tvbar b { font-weight: 700; }
.tag { flex: none; font-size: .66rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--surface-2); border-radius: 4px; padding: 2px 5px; }

/* ---------- placar grande (tela do jogo) ---------- */
.hero { padding: 18px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 8px; }
.hteam { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
.hteam img, .hteam .ph { width: 56px; height: 56px; object-fit: contain; }
.hteam b { font-weight: 700; font-size: .95rem; line-height: 1.2; text-wrap: balance; }
.hteam small { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
.hscore { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; min-width: 110px; }
.hscore .big { font-family: var(--f-display); font-stretch: 75%; font-weight: 900; font-size: 2.9rem; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: .01em; white-space: nowrap; }
.hscore .big .x { color: var(--muted); font-weight: 500; margin: 0 .12em; }
.hscore .when { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 1.6rem; line-height: 1; }
.hscore .stline { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; text-align: center; }
.hscore .stline.live { color: var(--live); }
.scorers { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; font-size: .8rem; color: var(--muted); }
.scorers div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.scorers div:first-child { text-align: right; }
.scorers span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linescore { overflow-x: auto; }
.linescore table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .85rem; }
.linescore th, .linescore td { padding: 5px 6px; text-align: center; }
.linescore th { color: var(--muted); font-weight: 600; font-size: .72rem; text-transform: uppercase; }
.linescore td:first-child, .linescore th:first-child { text-align: left; }
.linescore td.tot { font-weight: 800; }

/* ---------- abas ---------- */
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); background: var(--surface); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; padding: 12px 12px 10px; font-size: .85rem; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; text-transform: uppercase; letter-spacing: .03em; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--live); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; align-self: flex-start; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-size: .85rem; font-weight: 700; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ---------- lances ---------- */
.tl { display: flex; flex-direction: column; }
.ev { display: grid; grid-template-columns: minmax(0, 1fr) 46px minmax(0, 1fr); align-items: center; gap: 8px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: .88rem; }
.ev:first-child { border-top: 0; }
.ev .min { text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; font-size: .82rem; color: var(--muted); }
.ev .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ev .side.home { justify-content: flex-end; text-align: right; }
.ev .side .txt { display: flex; flex-direction: column; min-width: 0; }
.ev .side .txt b { font-weight: 700; overflow-wrap: anywhere; }
.ev .side .txt small { color: var(--muted); font-size: .75rem; overflow-wrap: anywhere; }
.ev.goal .min { color: var(--ink); }
.ev.div { grid-template-columns: 1fr; text-align: center; background: var(--surface-2); font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 7px 14px; }
.ico { flex: none; width: 18px; height: 18px; display: inline-grid; place-items: center; }
.card-y, .card-r { display: inline-block; width: 11px; height: 15px; border-radius: 2px; }
.card-y { background: var(--yellow); }
.card-r { background: var(--loss); }
.sp { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: .86rem; }
.sp:first-child { border-top: 0; }
.sp .ty { font-weight: 800; font-size: .72rem; letter-spacing: .04em; color: var(--muted); display: block; }
.sp .score { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- campinho ---------- */
.pitch { position: relative; width: 100%; max-width: 440px; margin: 0 auto; aspect-ratio: 68 / 108; background: repeating-linear-gradient(180deg, var(--pitch) 0 10%, var(--pitch-2) 10% 20%); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.pitch::before { content: ""; position: absolute; inset: 10px; border: 2px solid var(--pitch-line); border-radius: 4px; pointer-events: none; }
.pitch .mid { position: absolute; left: 10px; right: 10px; top: 50%; border-top: 2px solid var(--pitch-line); }
.pitch .circle { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; border: 2px solid var(--pitch-line); border-radius: 50%; transform: translate(-50%, -50%); }
.pitch .box { position: absolute; left: 30%; right: 30%; height: 8%; border: 2px solid var(--pitch-line); }
.pitch .box.t { top: 10px; border-top: 0; }
.pitch .box.b { bottom: 10px; border-bottom: 0; }
.half { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-around; padding: 14px 6px; z-index: 1; }
.pline { display: flex; justify-content: space-around; align-items: flex-start; }
.pl { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; width: 68px; min-width: 0; }
.pl .num { position: relative; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; font-variant-numeric: tabular-nums; border: 2px solid rgba(255,255,255,.85); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.pl .pn { color: #fff; font-size: .7rem; font-weight: 600; max-width: 68px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.pl .bd { position: absolute; display: flex; gap: 1px; }
.pl .bd.tr { top: -4px; right: 8px; }
.pl .bd.tl { top: -4px; left: 8px; }
.pl .bd .card-y, .pl .bd .card-r { width: 8px; height: 11px; border: 1px solid rgba(0,0,0,.25); }
.ball { width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 1.5px solid #111; display: inline-block; position: relative; }
.ball::after { content: ""; position: absolute; inset: 3px; background: #111; border-radius: 1px; transform: rotate(45deg); }
.ball.own { background: var(--loss); }
.subo { font-size: .62rem; font-weight: 800; color: #fff; background: var(--loss); border-radius: 3px; padding: 0 3px; line-height: 13px; }
.form-tag { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .85rem; font-weight: 700; max-width: 440px; margin: 0 auto; width: 100%; }
.form-tag span { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.form-tag em { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.lineup-card { display: flex; flex-direction: column; gap: 10px; }
.bench { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.bench h3 { margin: 0 0 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.bench ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bench li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: .85rem; min-width: 0; }
.bench li .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.bench li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench li .in { font-size: .7rem; font-weight: 800; color: var(--win); white-space: nowrap; }

    `<button class="chip" data-league="${l.id}" aria-pressed="${l.id === state.league}"${l.id !== "all" ? ` style="--c: var(--lg-${l.id})"` : ""}>${l.id !== "all" ? "<i></i>" : ""}${esc(l.short_name)}</button>`).join("");
  const all = [...state.games.values()];
  const day = all.filter((g) => dayOffsetOf(g.starts_at) === state.day && (state.league === "all" || g.league_id === state.league));
  const rank = { in: 0, pre: 1, post: 2 };
  let out = "";
  for (const lg of leagues) {
    const gs = day.filter((g) => g.league_id === lg.id)
      .sort((a, b) => (state.day === 0 ? (rank[a.state] ?? 1) - (rank[b.state] ?? 1) : 0) || a.starts_at.localeCompare(b.starts_at));

      <div class="card">${gs.map((g) => gameHTML(g)).join("")}</div>
    </section>`;
  }
  if (!out) {
    if (!state.games.size && state.online) out = `<section class="section">${skeleton(4)}</section>`;
    else if (!state.games.size) out = errorBox("Sem conexão agora. Confira a internet e abra de novo.");

  }
  const liveAll = all.some((g) => g.state === "in");
  return `<div class="filters" role="toolbar" aria-label="Filtrar campeonato">${chips}</div>
    ${state.online ? "" : `<div class="banner">Sem internet agora. Mostrando os últimos dados carregados.</div>`}
    ${out}
    <div class="foot"><span>${state.lastFetch ? `Atualizado às ${fmtTime.format(state.lastFetch)}${liveAll ? " · placar ao vivo atualiza sozinho" : ""}` : "Carregando jogos…"}</span>
    <span>Toque num jogo para ver escalação, lances e estatísticas.</span></div>`;
}

let teamsCache = null, teamsLoading = false;
function viewSearch() {
  if (!teamsCache && !teamsLoading && (teamsLoading = true)) teamsList().then((l) => { teamsCache = l; if (route().name === "busca") renderResults(); }).catch(() => { teamsCache = []; if (route().name === "busca") renderResults(); });
  return `<label class="search">${ICON.search}<input id="q" type="search" placeholder="Buscar time ou campeonato" autocomplete="off" enterkeyhint="search" value="${esc(state.query)}" aria-label="Buscar time ou campeonato"></label>

function renderResults() {
  const box = $("results"); if (!box) return;
  const q = norm(state.query.trim());
  const leagues = state.leagues.length ? state.leagues : DEFAULT_LEAGUES;
  if (!q) {
    box.innerHTML = `<section class="section"><div class="sec-title">Campeonatos</div>${viewLeagues()}</section>
      <p class="muted" style="font-size:.85rem;margin:0">Digite o nome de um time para ver a agenda, os resultados e a posição na tabela.</p>`;
    return;
  }
  const lgHits = leagues.filter((l) => norm(l.name).includes(q) || norm(l.short_name).includes(q));
  if (!teamsCache) { box.innerHTML = skeleton(4); return; }
  const score = (t) => {
    const n = norm(t.name), s = norm(t.short), a = norm(t.abbr);
    if (n === q || s === q || a === q) return 0;
    if (n.startsWith(q) || s.startsWith(q)) return 1;
    if (n.split(/\s+/).some((w) => w.startsWith(q))) return 2;
    if (n.includes(q) || s.includes(q)) return 3;
    return 9;
  };
  const hits = teamsCache.map((t) => ({ t, s: score(t) })).filter((x) => x.s < 9).sort((a, b) => a.s - b.s || a.t.name.localeCompare(b.t.name)).slice(0, 40);
  let html = "";
  if (lgHits.length) html += `<section class="section"><div class="sec-title">Campeonatos</div><div class="card res">${lgHits.map((l) =>
    `<a href="#/liga/${l.id}" style="--c: var(--lg-${l.id})"><span class="lgbadge" style="width:32px;height:32px;border-radius:9px;background:var(--c);display:grid;place-items:center;color:#fff;font-size:.62rem;font-weight:900">${BADGE[l.id]}</span><div style="min-width:0"><b>${esc(l.name)}</b></div><span></span>${ICON.chev}</a>`).join("")}</div></section>`;
  if (hits.length) html += `<section class="section"><div class="sec-title">Times</div><div class="card res">${hits.map(({ t }) =>
    `<a href="#/time/${t.league}/${esc(t.id)}">${logoImg(t.logo, "", 32)}<div style="min-width:0"><b>${esc(t.name)}</b></div><span class="lgtag" style="--c: var(--lg-${t.league})">${esc(leagueOf(t.league).short_name)}</span>${ICON.chev}</a>`).join("")}</div></section>`;
  if (!html) html = `<div class="empty"><strong>Nada encontrado</strong><span>Confira a grafia. A busca cobre os times do Brasileirão, Premier League, Champions, NBA e NFL.</span></div>`;
  box.innerHTML = html;
}

const loading = new Set();
function loadGame(lg, id, force) {

  if (loading.has(k)) return;

  api(params, force ? 0 : 15000)
    .catch((e) => { if (!peek(params)) apiCache.set(k, { at: Date.now(), data: { error: e.message } }); })

function sideTeam(d, side) { return d.teams.find((t) => t.side === side) || { name: "", short: "", logo: null }; }
function heroStatus(d) {

}
function heroFromRow(g) {

    teams: [

function hero(d) {

  };

      extra = `<div class="scorers"><div>${col(sides[0])}</div><div>${col(sides[1])}</div></div>`;

  }
  if (d.leaders.length) {
    html += `<section class="section"><div class="sec-title">${d.state === "pre" ? "Destaques da temporada" : "Destaques do jogo"}</div><div class="card leaders">${sides.map((s) => {
      const l = d.leaders.find((x) => x.side === s); const t = sideTeam(d, s);
      return `<div><h4>${logoImg(t.logo, "logo", 20)}${esc(t.abbr || t.short)}</h4>${(l?.cats || []).map((c) => `<p><small>${esc(LEADER_PT[c.cat] || c.cat)}</small><span><b>${esc(c.n)}</b> · ${esc(c.v)}</span></p>`).join("")}</div>`;
    }).join("")}</div></section>`;
  }
  if (d.state === "pre" && d.form.length) html += formBlock(d);
  html += `<section class="section"><div class="sec-title">Informações</div><div class="card"><dl class="info">
    <dt>Data</dt><dd>${esc(fullDate(d.date))}</dd>
    <dt>Onde ver</dt><dd>${g?.channels_override ? esc(g.channels_override)
      : `<span class="muted" style="font-weight:500">Ainda sem confirmação para este jogo.${L.channels ? ` Costuma passar em: ${esc(L.channels)}` : ""}</span>`}</dd>
    ${d.venue ? `<dt>Local</dt><dd>${esc(d.venue)}</dd>` : ""}
    ${d.referee ? `<dt>Árbitro</dt><dd>${esc(d.referee)}</dd>` : ""}
    ${d.attendance ? `<dt>Público</dt><dd>${Number(d.attendance).toLocaleString("pt-BR")}</dd>` : ""}
    <dt>Campeonato</dt><dd><a href="#/liga/${lg}" style="text-decoration:underline">${esc(L.name)}</a></dd>
  </dl></div></section>`;
  return html;
}
function evHTML(e, d) {
  if (e.kind === "ht") {
    const h = sideTeam(d, "home"), a = sideTeam(d, "away");
    return `<div class="ev div">Intervalo${h.lines?.[0] != null ? ` · ${esc(h.lines[0])} - ${esc(a.lines?.[0] ?? "")}` : ""}</div>`;
  }
  let icon = "", title = "", sub = "";
  const p0 = e.p[0]?.n || "", p1 = e.p[1]?.n || "";
  if (e.kind === "goal" || e.kind === "pen") { icon = `<i class="ball"></i>`; title = p0; sub = e.kind === "pen" ? "Gol de pênalti" : p1 ? `Assistência: ${p1}` : "Gol"; }
  else if (e.kind === "own") { icon = `<i class="ball own"></i>`; title = p0; sub = "Gol contra"; }
  else if (e.kind === "yellow") { icon = `<i class="card-y"></i>`; title = p0; sub = "Cartão amarelo"; }
  else if (e.kind === "red") { icon = `<i class="card-r"></i>`; title = p0; sub = "Cartão vermelho"; }
  else if (e.kind === "sub") { icon = ICON.sub; title = `Entra ${p0}`; sub = p1 ? `Sai ${p1}` : ""; }
  else if (e.kind === "penmiss") { icon = `<i class="ball" style="opacity:.4"></i>`; title = p0; sub = "Pênalti perdido"; }
  const side = `<div class="txt"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;
  const cell = (s) => e.side === s ? `<div class="side ${s}">${s === "home" ? side + `<span class="ico">${icon}</span>` : `<span class="ico">${icon}</span>` + side}</div>` : `<div></div>`;
  return `<div class="ev ${["goal", "pen", "own"].includes(e.kind) ? "goal" : ""}">${cell("home")}<span class="min">${esc(e.clock)}</span>${cell("away")}</div>`;
}

// Campinho: monta as linhas a partir do esquema (ex.: 4-3-3) e da posição de cada jogador.
const DEPTH = { G: 0, GK: 0, SW: 1, CD: 1, CB: 1, D: 1, LB: 1, RB: 1, LWB: 1.5, RWB: 1.5, WB: 1.5, DM: 2, CDM: 2, CM: 3, M: 3, LM: 3, RM: 3, AM: 4, CAM: 4, LAM: 4, RAM: 4, LW: 5, RW: 5, LF: 5, RF: 5, F: 6, CF: 6, ST: 6, FW: 6 };
const baseOf = (pos) => String(pos || "").split("-")[0].toUpperCase();
// 0 = ponta esquerda, 1 = centro-esquerda, 2 = centro, 3 = centro-direita, 4 = ponta direita
function latOf(pos) {
  const p = String(pos || "").toUpperCase(), b = baseOf(p);
  if (/^L/.test(b)) return 0;
  if (/^R/.test(b)) return 4;
  if (p.endsWith("-L")) return 1;
  if (p.endsWith("-R")) return 3;
  return 2;
}
function depthOf(p) { const d = DEPTH[baseOf(p.pos)] ?? 3; return d >= 5 && latOf(p.pos) === 2 ? d + 0.5 : d; }
function lineupLines(t) {
  const gk = t.starters.filter((p) => baseOf(p.pos) === "G" || baseOf(p.pos) === "GK");
  const rest = t.starters.filter((p) => !gk.includes(p)).sort((a, b) => depthOf(a) - depthOf(b));
  const counts = String(t.formation || "").split("-").map(Number).filter((n) => n > 0);
  let lines = [];
  if (counts.length && counts.reduce((s, n) => s + n, 0) === rest.length) {
    let i = 0; for (const c of counts) { lines.push(rest.slice(i, i + c)); i += c; }
  } else {
    const by = new Map(); for (const p of rest) { const k = Math.floor(depthOf(p)); if (!by.has(k)) by.set(k, []); by.get(k).push(p); }
    lines = [...by.keys()].sort((a, b) => a - b).map((k) => by.get(k));
  }
  lines = lines.map((l) => l.slice().sort((a, b) => latOf(a.pos) - latOf(b.pos)));
  return [gk, ...lines].filter((l) => l.length);
}
function playerMarks(d) {
  const m = new Map();
  const get = (id) => { if (!m.has(id)) m.set(id, { goals: 0, own: 0, yellow: 0, red: 0, out: null, in: null }); return m.get(id); };
  for (const e of d.events) {
    const a = e.p[0]?.id, b = e.p[1]?.id;
    if (!a) continue;
    if (e.kind === "goal" || e.kind === "pen") get(a).goals++;
    else if (e.kind === "own") get(a).own++;
    else if (e.kind === "yellow") get(a).yellow++;
    else if (e.kind === "red") get(a).red++;
    else if (e.kind === "sub") { get(a).in = e.clock; if (b) get(b).out = e.clock; }
  }
  return m;
}
function plHTML(p, color, marks) {
  const mk = marks.get(p.id) || {};
  const name = p.short || lastName(p.n);
  const tl = [...Array(mk.goals || 0)].map(() => `<i class="ball"></i>`).join("") + [...Array(mk.own || 0)].map(() => `<i class="ball own"></i>`).join("");
  const tr = (mk.red ? `<i class="card-r"></i>` : mk.yellow ? `<i class="card-y"></i>` : "") + (mk.out ? `<span class="subo">${esc(String(mk.out).replace("'", ""))}′</span>` : "");
  return `<div class="pl" title="${esc(p.n)}"><span class="num" style="background:${esc(color)};color:${textOn(color)}">${esc(p.num)}${tl ? `<span class="bd tl">${tl}</span>` : ""}${tr ? `<span class="bd tr">${tr}</span>` : ""}</span><span class="pn">${esc(name)}</span></div>`;
}
function lineupsBlock(d) {
  const H = d.lineups.find((l) => l.side === "home"), A = d.lineups.find((l) => l.side === "away");
  if (!H || !A) return `<div class="card"><div class="empty"><span>Escalações ainda não divulgadas. Costumam sair cerca de 1 hora antes do jogo.</span></div></div>`;
  const marks = playerMarks(d);
  const colH = H.color || "#d7262e", colA = (A.color && A.color.toLowerCase() !== colH.toLowerCase()) ? A.color : "#ffffff";
  const awayLines = lineupLines(A).map((l) => l.slice().reverse()); // visitante ataca para baixo: espelha esquerda/direita
  const homeLines = lineupLines(H).reverse();                        // mandante: goleiro embaixo
  const th = sideTeam(d, "home"), ta = sideTeam(d, "away");
  const benchList = (L) => L.bench.map((p) => { const mk = marks.get(p.id) || {}; return `<li><span class="n">${esc(p.num)}</span><span>${esc(p.n)}</span>${mk.in ? `<span class="in">▲ ${esc(mk.in)}</span>` : "<span></span>"}</li>`; }).join("");
  return `<div class="card pad lineup-card">
    <div class="form-tag"><span>${logoImg(ta.logo, "logo", 22)}${esc(ta.short || ta.name)}</span><em>${esc(A.formation || "")}</em></div>
    <div class="pitch">
      <span class="mid"></span><span class="circle"></span><span class="box t"></span><span class="box b"></span>
      <div class="half">${awayLines.map((l) => `<div class="pline">${l.map((p) => plHTML(p, colA, marks)).join("")}</div>`).join("")}</div>
      <div class="half">${homeLines.map((l) => `<div class="pline">${l.map((p) => plHTML(p, colH, marks)).join("")}</div>`).join("")}</div>
    </div>
    <div class="form-tag"><span>${logoImg(th.logo, "logo", 22)}${esc(th.short || th.name)}</span><em>${esc(H.formation || "")}</em></div></div>
    <section class="section"><div class="sec-title">Reservas</div><div class="card pad bench">
      <div><h3>${logoImg(th.logo, "logo", 18)}${esc(th.short || th.name)}</h3><ul>${benchList(H)}</ul></div>
      <div><h3>${logoImg(ta.logo, "logo", 18)}${esc(ta.short || ta.name)}</h3><ul>${benchList(A)}</ul></div>
    </div></section>`;
}
function numOf(v) {
  const s = String(v ?? "").trim();
  let m = /^(\d+(?:\.\d+)?)\s*[-/]\s*(\d+(?:\.\d+)?)$/.exec(s);
  if (m) return Number(m[1]);
  m = /^(\d+):(\d{2})$/.exec(s);
  if (m) return Number(m[1]) * 60 + Number(m[2]);
  const n = parseFloat(s.replace(",", "."));
  return isNaN(n) ? 0 : n;
}
function statsBlock(d) {
  const sides = isUS(d.league) ? ["away", "home"] : ["home", "away"];
  const A = sideTeam(d, sides[0]), B = sideTeam(d, sides[1]);
  return `<div class="card pad"><div class="stats">
    <div class="stat"><div class="lab"><span>${logoImg(A.logo, "logo", 22)}</span><em></em><span>${logoImg(B.logo, "logo", 22)}</span></div></div>
    ${d.stats.map((s) => {
      const va = s[sides[0]], vb = s[sides[1]];
      const a = numOf(va), b = numOf(vb), tot = a + b || 1;
      const unit = s.unit === "%" ? "%" : "";
      return `<div class="stat"><div class="lab"><span class="${a > b ? "hi" : ""}">${esc(va)}${unit}</span><em>${esc(s.label)}</em><span class="${b > a ? "hi" : ""}">${esc(vb)}${unit}</span></div>
        <div class="bars"><div><i class="${a > b ? "hi" : ""}" style="width:${(a / tot * 100).toFixed(1)}%"></i></div><div><i class="${b > a ? "hi" : ""}" style="width:${(b / tot * 100).toFixed(1)}%"></i></div></div></div>`;
    }).join("")}
  </div></div>`;
}
function playersBlock(d, key) {
  const sides = isUS(d.league) ? ["away", "home"] : ["home", "away"];
  const side = state.seg[key] || sides[0];
  const tp = d.players.find((p) => p.side === side);
  const btn = (s) => { const t = sideTeam(d, s); return `<button data-seg="${s}" aria-pressed="${s === side}">${logoImg(t.logo, "logo", 18)}${esc(t.abbr || t.short)}</button>`; };
  return `<div class="seg" role="group">${sides.map(btn).join("")}</div>
    ${(tp?.groups || []).map((g) => `<section class="section"><div class="sec-title">${esc(g.title)}</div><div class="card"><div class="tbl-wrap"><table class="tbl ptbl">
      <thead><tr><th>Jogador</th>${g.labels.map((l) => `<th>${esc(l)}</th>`).join("")}</tr></thead>
      <tbody>${g.rows.map((r) => `<tr><td class="l${r.starter ? "" : " st0"}">${esc(r.n)}</td>${r.s.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div></div></section>`).join("") || `<div class="empty"><span>Sem estatísticas de jogadores ainda.</span></div>`}`;
}
function formBlock(d) {
  const sides = isUS(d.league) ? ["away", "home"] : ["home", "away"];
  return `<section class="section"><div class="sec-title">Últimos 5 jogos</div><div class="card">${sides.map((s) => {
    const f = d.form.find((x) => x.side === s); const t = sideTeam(d, s);
    if (!f) return "";
    return `<div class="form-row">${logoImg(t.logo, "logo", 28)}<b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.short || t.name)}</b>
      <div class="pills">${f.games.slice(-5).map((g) => `<span class="pill ${esc(g.res)}" title="${esc(`${g.atVs === "@" ? "fora" : "casa"} · ${g.oppName} · ${g.score}`)}">${esc(FORM_PT[g.res] || "–")}</span>`).join("")}</div></div>`;
  }).join("")}</div></section>`;
}
function confrontBlock(d, lg) {
  let html = d.form.length ? formBlock(d) : "";
  if (d.h2h?.games?.length) {
    const games = d.h2h.games.map((e) => fromSched({ ...e, detail: e.state === "post" ? "FT" : "", clock: null, period: null }, lg))
      .sort((a, b) => b.starts_at.localeCompare(a.starts_at));
    html += `<section class="section"><div class="sec-title">${esc(d.h2h.title)}</div><div class="card">${games.map((g) => gameHTML(g, { showDate: true })).join("")}</div></section>`;
  }
  return html || `<div class="empty"><span>Sem histórico entre os dois.</span></div>`;
}

// ---------- montagem ----------
let pending = false;
function scheduleRender() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); }
function rerender() { scheduleRender(); }
function rerenderIf(name, a, b) { const r = route(); if (r.name === name && r.args[0] === a && (b == null || r.args[1] === b)) scheduleRender(); }

function render(routeChanged) {
  const r = route();
  renderNav(r);
  let html = "", title = "";
  if (r.name === "home") html = viewHome();
  else if (r.name === "ligas") html = viewLeagues();
  else if (r.name === "busca") html = viewSearch();
  else if (r.name === "liga" && SPORT[r.args[0]]) { title = leagueOf(r.args[0]).short_name; html = viewLeague(r.args[0]); }
  else if (r.name === "time" && SPORT[r.args[0]] && /^\d+$/.test(r.args[1] || "")) { const v = viewTeam(r.args[0], r.args[1]); title = v.title; html = v.html; }
  else if (r.name === "jogo" && SPORT[r.args[0]] && /^\d+$/.test(r.args[1] || "")) { const v = viewGame(r.args[0], r.args[1]); title = v.title; html = v.html; setupGameTimer(r.args[0], r.args[1]); }
  else { location.replace("#/"); return; }
  renderTop(r, title);
  // Na busca, não recria o campo (manteria o teclado aberto).
  if (r.name === "busca" && !routeChanged && $("q")) { renderResults(); return; }
  $("view").innerHTML = html;
  if (r.name === "busca") {
    renderResults();
    const q = $("q"); if (routeChanged && q && !state.query) setTimeout(() => q.focus(), 50);
  }
  if (routeChanged) {
    window.scrollTo(0, scrolls.get(location.hash) || 0);
    if (r.name === "home") { const sel = document.querySelector('.day[aria-pressed="true"]'); if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" }); }
  }
}
function setupGameTimer(lg, id) {
  if (timer) return;
  timer = setInterval(() => {
    if (document.visibilityState !== "visible") return;
    const d = peek({ type: "game", league: lg, id });
    const g = gameFromList(lg, id);
    const live = d?.state === "in" || g?.state === "in" || (d?.state === "pre" && new Date(d.date) - Date.now() < 15 * 60000);
    if (live) loadGame(lg, id, true);
  }, 20000);
}

// ---------- interação ----------
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest("[data-back]")) { goBack(); return; }
  const day = t.closest(".day");
  if (day) { state.day = Number(day.dataset.day); render(); return; }
  const chip = t.closest(".chip[data-league]");
  if (chip) { state.league = chip.dataset.league; store.set("league", state.league); render(); return; }
  const tab = t.closest(".tab[data-tab]");
  if (tab) { const r = route(); const key = r.name === "liga" ? `liga:${r.args[0]}` : `${r.name}:${r.args[0]}:${r.args[1]}`; state.tabs[key] = tab.dataset.tab; render(); return; }
  const seg = t.closest("[data-seg]");
  if (seg) { const r = route(); const key = r.name === "liga" ? `liga:${r.args[0]}` : `${r.name}:${r.args[0]}:${r.args[1]}`; state.seg[key] = seg.dataset.seg; render(); return; }
});
document.addEventListener("input", (e) => { if (e.target.id === "q") { state.query = e.target.value; renderResults(); } });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  refresh();
  const r = route(); if (r.name === "jogo") loadGame(r.args[0], r.args[1], true);
});
window.addEventListener("online", refresh);

function subscribe() {
  if (!sb) return;
  sb.channel("jogos")
    .on("postgres_changes", { event: "*", schema: "public", table: "games" }, (p) => {
      const g = p.new;
      if (!g || !g.id) return;
      noteChange(state.games.get(g.id), g);
      state.games.set(g.id, Object.assign(state.games.get(g.id) || {}, g));
      state.lastFetch = new Date();
      const r = route();
      if (r.name === "home") scheduleRender();
      else if (r.name === "jogo" && g.id === `${r.args[0]}:${r.args[1]}`) loadGame(r.args[0], r.args[1], true);
    })
    .subscribe();
}
setInterval(() => {
  if (document.visibilityState !== "visible") return;
  const anyLive = [...state.games.values()].some((g) => g.state === "in");
  if (anyLive || Date.now() - (state.lastFetch || 0) > 5 * 60000) refresh();
}, 60000);
setInterval(() => { if (route().name === "home" && [...bumps.values()].some((b) => Date.now() - b.at < 61000)) render(); }, 6500);

// ---------- início ----------
(function boot() {
  state.league = store.get("league", "all");
  state.leagues = store.get("leagues", []);
  for (const g of store.get("games", [])) state.games.set(g.id, g);
  if (!["all", ...Object.keys(SPORT)].includes(state.league)) state.league = "all";
  render(true);
  if (!sb) { state.online = false; render(); return; }
  refresh().then(subscribe);
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
